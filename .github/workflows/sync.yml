name: Manual Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Run sync script
        run: node scripts/sync-data.js
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      - name: Create sync pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          add-paths: |
            books_data.ts
            public/assets
          base: main
          branch: automation/sync-book-data
          commit-message: "chore: update book data"
          delete-branch: true
          title: "chore: update book data"
          body: "Automated synchronization from the source spreadsheet."
